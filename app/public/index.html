<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salesforce Headless 360 — Hotel Concierge</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>🏨 Hotel Account Concierge</h1>
      <p class="tagline">
        A headless Salesforce demo — no Salesforce UI, just APIs.
        <span id="mode-badge" class="badge">…</span>
      </p>
    </header>

    <main>
      <!-- Layer 1: CRM Data REST API -->
      <section class="panel" id="data-panel">
        <div class="panel-head">
          <h2>CRM Data</h2>
          <span class="surface">Data REST API</span>
        </div>

        <form id="create-form" class="create-form">
          <input name="Name" placeholder="New hotel account name…" required />
          <input name="BillingCity" placeholder="City" />
          <button type="submit">+ Add</button>
        </form>

        <ul id="account-list" class="account-list">
          <li class="empty">Loading accounts…</li>
        </ul>
      </section>

      <!-- Layer 2: Agentforce Agent API -->
      <section class="panel" id="chat-panel">
        <div class="panel-head">
          <h2>Agentforce</h2>
          <span class="surface">Agent API</span>
        </div>

        <div id="chat-log" class="chat-log">
          <div class="msg agent">
            Hi! Ask me about your hotel accounts — e.g. “Summarize the Hilton
            Union Square account” or “Add a new hotel in Oakland”.
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input id="chat-input" placeholder="Message the agent…" autocomplete="off" required />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer id="footer">
      <span id="status-line">Connecting…</span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
